<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoalOracle — World Cup data for agents</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* shadcn zinc dark — solid colors only. Two background tiers (bg, surface).
     Text: foreground + muted only; --decor is reserved for decorative marks.
     Borders: --border for passive edges, --input for interactive controls.
     Spacing: 4pt scale (4, 8, 12, 16, 24, 32, 40, 64). Type: 12 / 13 / 14 / 17. */
  :root {
    --background: #09090b;       /* zinc-950 */
    --surface: #18181b;          /* zinc-900 */
    --secondary: #27272a;        /* zinc-800 */
    --border: #27272a;           /* zinc-800 */
    --input: #3f3f46;            /* zinc-700 */
    --foreground: #fafafa;       /* zinc-50 */
    --muted-foreground: #a1a1aa; /* zinc-400 */
    --decor: #71717a;            /* zinc-500 — never body text */
    --primary: #fafafa;
    --primary-foreground: #18181b;
    --primary-hover: #e4e4e7;
    --ring: #d4d4d8;
    --radius: 0.625rem;
    --radius-sm: 0.4375rem;
    --font-sans: "Geist", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, "SF Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html { color-scheme: dark; }
  body {
    background: var(--background); color: var(--foreground);
    font-family: var(--font-sans); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
    display: flex; flex-direction: column;
  }
  main.wrap { flex: 1; width: 100%; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  /* ---------- top bar ---------- */
  .topbar { border-bottom: 1px solid var(--border); }
  .topbar-in { display: flex; align-items: center; gap: 16px; height: 56px; }
  .wordmark { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .wordmark .dot { color: var(--muted-foreground); font-weight: 400; }
  .topbar .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .vsep { width: 1px; height: 20px; background: var(--border); }

  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 500; line-height: 1;
    border: 1px solid var(--border); color: var(--muted-foreground);
    border-radius: 999px; padding: 4px 12px; white-space: nowrap;
  }
  .badge.solid { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); font-weight: 600; }
  .badge .pulse { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.6s cubic-bezier(0.25,1,0.5,1) infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .badge .ok { width: 6px; height: 6px; border-radius: 50%; background: var(--decor); }
  .badge.online .ok { background: var(--foreground); }

  /* ---------- layout ---------- */
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 40px; padding: 40px 0 64px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .section-head h2 { font-size: 14px; font-weight: 600; color: var(--foreground); }
  .section-head .meta { font-size: 12px; color: var(--muted-foreground); font-family: var(--font-mono); }
  #matches > section { margin-top: 40px; }

  /* ---------- match rows ---------- */
  .rows { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .match { display: grid; grid-template-columns: 92px minmax(0,1fr) auto; align-items: center; gap: 16px; padding: 16px; background: var(--surface); }
  .rows > .match:not(:first-child) { border-top: 1px solid var(--border); }
  .match .when { font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); }
  .match .fixture { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .match .team { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .match .score { font-family: var(--font-mono); font-weight: 700; font-size: 14px; white-space: nowrap; }
  .match .stage { font-size: 12px; color: var(--muted-foreground); white-space: nowrap; }
  .match .actions { display: flex; align-items: center; gap: 8px; }

  .btn {
    font-family: var(--font-sans); font-size: 13px; font-weight: 500; line-height: 1;
    border-radius: var(--radius-sm); border: 1px solid transparent;
    padding: 8px 12px; cursor: pointer;
    transition: background-color 0.15s ease-out, border-color 0.15s ease-out;
  }
  .btn:focus-visible, a:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .btn-primary { background: var(--primary); color: var(--primary-foreground); font-weight: 600; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-outline { background: var(--surface); color: var(--foreground); border-color: var(--input); }
  .btn-outline:hover { background: var(--secondary); }
  .btn[disabled] { background: var(--surface); border-color: transparent; color: var(--muted-foreground); cursor: default; }
  .btn .price { font-family: var(--font-mono); font-weight: 500; color: inherit; }
  .btn-outline .price, .btn[disabled] .price { color: var(--muted-foreground); }

  /* ---------- payment trace (signature) ---------- */
  .trace { border-top: 1px solid var(--border); background: var(--surface); padding: 16px; font-family: var(--font-mono); font-size: 12px; line-height: 2; }
  .trace .ln { display: flex; gap: 12px; color: var(--muted-foreground); }
  .trace .ln.done { color: var(--foreground); }
  .trace .mark { width: 14px; text-align: center; color: var(--muted-foreground); }
  .trace .ln.done .mark { color: var(--foreground); }
  .trace a { color: var(--foreground); text-underline-offset: 3px; }

  /* ---------- analysis ---------- */
  .analysis { border-top: 1px solid var(--border); background: var(--surface); padding: 16px; display: grid; gap: 16px; }
  .analysis .verdict { font-size: 17px; font-weight: 600; letter-spacing: -0.005em; max-width: 560px; text-wrap: balance; }
  .probs { display: grid; gap: 8px; max-width: 560px; }
  .prob { display: grid; grid-template-columns: 82px minmax(0,1fr) 48px; gap: 12px; align-items: center; }
  .prob .lbl { font-size: 13px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prob .num { font-family: var(--font-mono); font-size: 12px; text-align: right; color: var(--muted-foreground); }
  .prob.top .lbl, .prob.top .num { color: var(--foreground); font-weight: 600; }
  .prob .track { height: 8px; background: var(--secondary); border-radius: 4px; overflow: hidden; }
  .prob .fill { height: 100%; background: var(--muted-foreground); border-radius: 4px; transform: scaleX(0); transform-origin: left; transition: transform 0.45s cubic-bezier(0.22,1,0.36,1); }
  .prob.top .fill { background: var(--foreground); }
  .factors { padding: 0; list-style: none; max-width: 560px; }
  .factors li { position: relative; padding: 8px 0 8px 20px; color: var(--muted-foreground); font-size: 13px; }
  .factors li::before { content: "·"; position: absolute; left: 4px; color: var(--decor); }
  .factors li + li { border-top: 1px solid var(--border); }
  .stat-line { font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); }
  .stat-line b { color: var(--foreground); font-weight: 600; }

  /* ---------- standings ---------- */
  .tables { display: grid; gap: 24px; }
  table { width: 100%; border-collapse: collapse; }
  caption { text-align: left; font-size: 13px; font-weight: 500; color: var(--muted-foreground); padding-bottom: 8px; }
  th { font-size: 12px; font-weight: 500; color: var(--muted-foreground); text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); }
  td { font-size: 13px; padding: 8px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: 0; }
  th.n, td.n { text-align: right; font-family: var(--font-mono); font-size: 12px; }
  td.pos { color: var(--muted-foreground); font-family: var(--font-mono); font-size: 12px; width: 28px; }
  td.team-cell { font-weight: 500; }
  td.pts { font-weight: 600; color: var(--foreground); }

  /* ---------- states ---------- */
  .skeleton { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .skeleton .sk-row { height: 52px; background: var(--surface); }
  .sk-row + .sk-row { border-top: 1px solid var(--border); }
  .sk-bar { height: 12px; width: 40%; margin: 20px 16px; border-radius: 6px; background: var(--secondary); animation: sk 1.4s ease-in-out infinite; }
  @keyframes sk { 50% { opacity: 0.5; } }
  .empty { border: 1px dashed var(--border); border-radius: var(--radius); padding: 32px 24px; text-align: center; }
  .empty p { color: var(--muted-foreground); font-size: 13px; }
  .empty .hint { margin-top: 4px; font-size: 12px; }

  footer { border-top: 1px solid var(--border); }
  .footer-in { display: flex; flex-wrap: wrap; gap: 8px 24px; padding: 16px 0 24px; font-size: 12px; color: var(--muted-foreground); }
  footer a { color: var(--muted-foreground); text-decoration: none; }
  footer a:hover { color: var(--foreground); text-decoration: underline; text-underline-offset: 3px; }

  @media (max-width: 640px) {
    .topbar-in { height: auto; padding: 12px 0; flex-wrap: wrap; gap: 8px 12px; }
    .wordmark .dot, .vsep { display: none; }
    .match { grid-template-columns: 1fr; gap: 12px; }
    .match > .badge, .match > .when { justify-self: start; }
    .match .fixture { flex-wrap: wrap; row-gap: 4px; }
    .match .actions, .match .actions .btn { width: 100%; }
    .match .actions .btn { padding: 12px; text-align: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .badge .pulse, .sk-bar { animation: none; }
    .prob .fill { transform: scaleX(1) !important; transition: none; }
    .btn { transition: none; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="wrap topbar-in">
    <span class="wordmark">GoalOracle<span class="dot"> · World Cup 2026</span></span>
    <div class="right">
      <span class="badge" id="net-badge">Injective testnet</span>
      <span class="vsep"></span>
      <span class="badge online" id="provider-badge"><span class="ok"></span><span id="provider-name">connecting</span></span>
    </div>
  </div>
</div>

<main class="wrap">
  <div>
    <section aria-labelledby="h-matches">
      <div class="section-head">
        <h2 id="h-matches">Matches</h2>
        <span class="meta" id="refreshed"></span>
      </div>
      <div id="matches">
        <div class="skeleton" aria-hidden="true">
          <div class="sk-row"><div class="sk-bar"></div></div>
          <div class="sk-row"><div class="sk-bar" style="width:55%"></div></div>
          <div class="sk-row"><div class="sk-bar" style="width:34%"></div></div>
        </div>
      </div>
    </section>
  </div>

  <aside>
    <section aria-labelledby="h-standings">
      <div class="section-head"><h2 id="h-standings">Standings</h2></div>
      <div class="tables" id="standings">
        <div class="skeleton" aria-hidden="true">
          <div class="sk-row"><div class="sk-bar"></div></div>
          <div class="sk-row"><div class="sk-bar" style="width:60%"></div></div>
        </div>
      </div>
    </section>
  </aside>
</main>

<footer>
  <div class="wrap footer-in">
    <span>Analytics are statistical estimates from a deterministic Poisson model, not betting advice.</span>
    <span>Premium calls settle in USDC on Injective EVM testnet via x402.</span>
    <a href="https://github.com/wildanre/goaloracle">GitHub</a>
  </div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let openMatchId = null;

async function health() {
  try {
    const h = await (await fetch("/healthz")).json();
    $("provider-name").textContent = h.provider === "mock" ? "demo data" : "live data";
    $("net-badge").textContent = h.network === "eip155:1439" ? "Injective testnet" : h.network;
  } catch { $("provider-name").textContent = "offline"; $("provider-badge").classList.remove("online"); }
}

function whenLabel(m) {
  if (m.status === "LIVE") return `<span class="badge solid"><span class="pulse"></span>${m.minute}&#8217;</span>`;
  if (m.status === "FINISHED") return `<span class="when">Full time</span>`;
  const d = new Date(m.utcDate);
  return `<span class="when">${d.toISOString().slice(11, 16)} UTC</span>`;
}

function matchRow(m) {
  const score = m.score.home === null ? "vs" : `${m.score.home}&#8211;${m.score.away}`;
  const stage = m.stage.replaceAll("_", " ").toLowerCase();
  const open = openMatchId === m.id;
  return `
    <div class="match" data-id="${m.id}">
      ${whenLabel(m)}
      <div class="fixture">
        <span class="team">${esc(m.homeTeam.name)}</span>
        <span class="score">${score}</span>
        <span class="team">${esc(m.awayTeam.name)}</span>
        <span class="stage">${esc(stage)}</span>
      </div>
      <div class="actions">
        <button class="btn ${m.status === "LIVE" ? "btn-primary" : "btn-outline"}" onclick="buyAnalysis(${m.id}, this)" ${open ? "disabled" : ""}>
          Buy analysis <span class="price">&#183; $0.01</span>
        </button>
      </div>
    </div>
    <div id="slot-${m.id}"></div>`;
}

async function loadMatches() {
  try {
    const [liveRes, todayRes] = await Promise.all([fetch("/matches/live"), fetch("/matches/today")]);
    const live = (await liveRes.json()).matches ?? [];
    const today = ((await todayRes.json()).matches ?? []).filter((m) => m.status !== "LIVE");
    let list = [...live, ...today];
    const recent = ((await (await fetch("/matches/recent")).json()).matches ?? [])
      .filter((m) => !list.some((x) => x.id === m.id)).slice(0, 4);
    if (list.length === 0) { list = recent.splice(0, 5); }
    if (list.length === 0) {
      $("matches").innerHTML = `<div class="empty"><p>No matches on the schedule right now.</p><p class="hint">Live fixtures appear here automatically during match days.</p></div>`;
      return;
    }
    const openSlot = openMatchId !== null ? document.getElementById(`slot-${openMatchId}`)?.innerHTML : null;
    const recentBlock = recent.length
      ? `<section aria-labelledby="h-recent"><div class="section-head"><h2 id="h-recent">Recent results</h2></div><div class="rows">${recent.map(matchRow).join("")}</div></section>`
      : "";
    $("matches").innerHTML = `<div class="rows">${list.map(matchRow).join("")}</div>${recentBlock}`;
    if (openMatchId !== null && openSlot) {
      const slot = document.getElementById(`slot-${openMatchId}`);
      if (slot) slot.innerHTML = openSlot;
    }
    $("refreshed").textContent = new Date().toTimeString().slice(0, 8);
  } catch {
    $("matches").innerHTML = `<div class="empty"><p>Can&#8217;t reach the GoalOracle API.</p><p class="hint">Start it with <code>pnpm api</code>, then reload.</p></div>`;
  }
}

async function loadStandings() {
  try {
    const { standings } = await (await fetch("/standings")).json();
    if (!standings?.length) { $("standings").innerHTML = `<div class="empty"><p>Standings appear once group games finish.</p></div>`; return; }
    $("standings").innerHTML = standings.map((g) => `
      <table>
        <caption>Group ${esc(g.group)}</caption>
        <thead><tr><th></th><th>Team</th><th class="n">P</th><th class="n">GD</th><th class="n">Pts</th></tr></thead>
        <tbody>
          ${g.table.map((r) => `<tr>
            <td class="pos">${r.position}</td>
            <td class="team-cell">${esc(r.team.name)}</td>
            <td class="n">${r.played}</td>
            <td class="n">${r.goalDifference > 0 ? "+" : ""}${r.goalDifference}</td>
            <td class="n pts">${r.points}</td>
          </tr>`).join("")}
        </tbody>
      </table>`).join("");
  } catch { $("standings").innerHTML = `<div class="empty"><p>Standings unavailable.</p></div>`; }
}

const traceSteps = [
  "GET /premium/match/:id/analysis",
  "402 quoted 10000 &#181;USDC on eip155:1439",
  "EIP-3009 authorization signed",
  "settling on Injective testnet",
];

function renderTrace(slot, doneCount, finalLine) {
  const visible = finalLine !== undefined ? doneCount : Math.min(doneCount + 1, traceSteps.length);
  const lines = traceSteps.slice(0, Math.max(visible, 1)).map((s, i) =>
    `<div class="ln ${i < doneCount ? "done" : ""}"><span class="mark">${i < doneCount ? "&#10003;" : "&#8226;"}</span><span>${s}</span></div>`).join("");
  slot.querySelector(".trace").innerHTML = lines + (finalLine ?? "");
}

async function buyAnalysis(id, btn) {
  openMatchId = id;
  btn.disabled = true;
  const slot = document.getElementById(`slot-${id}`);
  slot.innerHTML = `<div class="trace" role="status"></div>`;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let step = 1;
  renderTrace(slot, 0);
  const ticker = reduced ? null : setInterval(() => { if (step < traceSteps.length) renderTrace(slot, step++); else clearInterval(ticker); }, 550);
  try {
    const res = await fetch(`/demo/analyze/${id}`);
    const data = await res.json();
    if (ticker) clearInterval(ticker);
    if (!res.ok) throw new Error(data.error ?? `HTTP ${res.status}`);
    const a = data.analysis;
    const receiptLine = data.paid
      ? `<div class="ln done"><span class="mark">&#10003;</span><span>settled &#183; tx <a href="https://testnet.blockscout.injective.network/tx/${esc(data.receipt?.transaction ?? "")}" target="_blank" rel="noreferrer">${esc((data.receipt?.transaction ?? "").slice(0, 10))}&#8230;${esc((data.receipt?.transaction ?? "").slice(-4))}</a></span></div>`
      : `<div class="ln"><span class="mark">&#8226;</span><span>dry run &#183; quote returned, no wallet configured on this deployment</span></div>`;
    renderTrace(slot, data.paid ? traceSteps.length : 2, receiptLine);

    const m = data.match ?? {};
    const nameA = m.homeTeam?.name ?? "Home";
    const nameB = m.awayTeam?.name ?? "Away";
    const p = a.winProbability;
    const rows = [
      { lbl: nameA, v: p.a }, { lbl: "Draw", v: p.draw }, { lbl: nameB, v: p.b },
    ];
    const top = Math.max(p.a, p.draw, p.b);
    slot.insertAdjacentHTML("beforeend", `
      <div class="analysis">
        <p class="verdict">${esc(a.verdict)}</p>
        <div class="probs">
          ${rows.map((r) => `
            <div class="prob ${r.v === top ? "top" : ""}">
              <span class="lbl">${esc(r.lbl)}</span>
              <div class="track"><div class="fill" style="width:${Math.round(r.v * 100)}%"></div></div>
              <span class="num">${Math.round(r.v * 100)}%</span>
            </div>`).join("")}
        </div>
        <ul class="factors">${a.keyFactors.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>
        <p class="stat-line">expected goals <b>${a.expectedGoals.a}</b> &#8211; <b>${a.expectedGoals.b}</b> &#183; form <b>${a.formIndexA}</b> vs <b>${a.formIndexB}</b> / 10</p>
      </div>`);
    requestAnimationFrame(() => {
      slot.querySelectorAll(".prob .fill").forEach((el) => { el.style.transform = "scaleX(1)"; });
    });
  } catch (e) {
    if (ticker) clearInterval(ticker);
    renderTrace(slot, 1, `<div class="ln"><span class="mark">&#215;</span><span>failed &#183; ${esc(e.message ?? "request error")} &#183; try again</span></div>`);
    btn.disabled = false;
    openMatchId = null;
  }
}

health();
loadMatches();
loadStandings();
setInterval(loadMatches, 30_000);
</script>
</body>
</html>
